[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mplads-intel"
version = "0.1.0"
description = "AI-assisted forensic monitoring and decision support over MPLADS/eSAKSHI work-lifecycle data"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lifelines>=0.28",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=1.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# Reading site photographs and documents. Surya also needs the llama-server binary
# (winget install ggml.llamacpp) and its model (scripts/fetch_ocr_models.py); without
# them photographs are read by RapidOCR alone. Install torch from the CPU index to save
# ~4 GB: --extra-index-url https://download.pytorch.org/whl/cpu
ocr = [
    "rapidocr-onnxruntime>=1.4",
    "surya-ocr>=0.22",
    "docling>=2.100",
    "Pillow>=10.4",
]

[project.scripts]
mplads = "mplads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
